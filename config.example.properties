# Copy to config.properties (not committed) and fill in for your network.

# The control page, served from Home Assistant's www folder at /local/ (see README).
control.url=http://homeassistant.local:8123/local/kitchen-frame/control.html
# The Immich Kiosk slideshow.
slideshow.url=http://immich-kiosk.local:3000

# Where deploy.sh copies control.html + layout.js: the folder Home Assistant serves as /local/.
deploy.host=root@homeassistant-host
# Optional SSH key for that host; leave empty to use your default key.
deploy.key=
deploy.dest=/config/www/kitchen-frame
